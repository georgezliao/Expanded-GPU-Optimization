[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fused-hoad"
version = "0.1.0"
description = "Fused CUDA accelerators for higher-order automatic differentiation workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "George Liao"}]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

